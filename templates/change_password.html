<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu - Quản lý Thi đua</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { width: 260px; height: 100vh; position: fixed; top: 0; left: 0; background-color: #004080; color: white; padding-top: 20px; z-index: 1000; overflow-y: auto;}
        .sidebar h4 { font-size: 18px; font-weight: bold; text-align: center; padding-bottom: 15px; border-bottom: 1px solid #0054a6; }
        .sidebar .nav-link { color: #cce6ff; font-weight: 600; padding: 12px 20px; font-size: 14px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #002244; color: white; border-left: 4px solid #4da6ff; }
        
        /* Đã thêm hiệu ứng mượt mà khi đổi kích thước */
        .main-content { margin-left: 260px; padding: 35px; transition: all 0.3s ease; }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        /* ======================================================== */
        /* [QUAN TRỌNG]: BỘ CHỐNG ÉP KHUNG TRÊN MÀN HÌNH ĐIỆN THOẠI */
        /* ======================================================== */
        @media (max-width: 768px) {
            .sidebar { display: none !important; }
            /* Trả lại 100% không gian cho Form khi xem trên điện thoại */
            .main-content { margin-left: 0 !important; padding: 15px !important; width: 100% !important; }
        }
    </style>
</head>
<body>
    {% include 'sidebar.html' %}

    <div class="main-content">
        <!-- FORM ĐỔI MẬT KHẨU MOBILE XỊN SÒ -->
        <div class="container mb-5 px-0 px-md-3" style="max-width: 500px; margin: 0 auto;">
            
            <!-- Tiêu đề Header -->
            <div class="text-center mb-4 mt-2">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center shadow-sm mb-3" style="width: 65px; height: 65px; background: linear-gradient(135deg, #0ea5e9, #0284c7) !important;">
                    <i class="fa-solid fa-shield-halved fa-beat-fade fs-2"></i>
                </div>
                <h3 class="fw-bold" style="color: #0f172a; font-size: 22px;">Đổi Mật Khẩu</h3>
                <p class="text-muted small mb-0">Cập nhật mật khẩu bảo mật cho tài khoản của bạn</p>
            </div>

            <!-- Hiển thị thông báo (nếu có) -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} border-0 shadow-sm fw-bold rounded-3 mb-3 d-flex align-items-center gap-2" style="font-size: 14px;">
                            <i class="fa-solid {{ 'fa-circle-check' if category == 'success' else 'fa-triangle-exclamation' }} fs-5"></i> {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Khối Form Nhập liệu -->
            <div class="card border-0 shadow-sm" style="border-radius: 16px; overflow: hidden; background: #ffffff;">
                <div class="card-body p-4">
                    <form action="/change-password" method="POST">
                        
                        <!-- 1. Tên đăng nhập xác thực -->
                        <div class="mb-4">
                            <label class="form-label fw-bold text-secondary mb-2" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">Tên đăng nhập xác thực</label>
                            <div class="input-group shadow-sm" style="border-radius: 12px; overflow: hidden;">
                                <span class="input-group-text bg-light border-0 text-muted px-3"><i class="fa-solid fa-user-shield"></i></span>
                                <!-- Chỉnh thành readonly để tránh sửa nhầm tên đăng nhập -->
                                <input type="text" class="form-control border-0 bg-light py-3 fw-bold text-primary" name="login_id" value="{{ default_username }}" required placeholder="VD: admin" style="font-size: 15px;" readonly>
                            </div>
                        </div>

                        <!-- 2. Mật khẩu mới -->
                        <div class="mb-4">
                            <label class="form-label fw-bold text-secondary mb-2" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">Mật khẩu Mới</label>
                            <div class="input-group shadow-sm" style="border-radius: 12px; overflow: hidden;">
                                <span class="input-group-text bg-light border-0 text-primary px-3"><i class="fa-solid fa-key"></i></span>
                                <input type="password" class="form-control border-0 bg-light py-3 pwd-input" name="new_password" required placeholder="Tối thiểu 3 ký tự..." style="font-size: 15px;">
                                <span class="input-group-text bg-light border-0 cursor-pointer toggle-pwd" style="cursor: pointer; padding-right: 15px;">
                                    <i class="fa-solid fa-eye text-muted"></i>
                                </span>
                            </div>
                        </div>

                        <!-- 3. Xác nhận Mật khẩu mới -->
                        <div class="mb-4">
                            <label class="form-label fw-bold text-secondary mb-2" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">Xác nhận Mật khẩu</label>
                            <div class="input-group shadow-sm" style="border-radius: 12px; overflow: hidden;">
                                <span class="input-group-text bg-light border-0 text-success px-3"><i class="fa-solid fa-check-double"></i></span>
                                <input type="password" class="form-control border-0 bg-light py-3 pwd-input" name="confirm_password" required placeholder="Nhập lại mật khẩu mới..." style="font-size: 15px;">
                                <span class="input-group-text bg-light border-0 cursor-pointer toggle-pwd" style="cursor: pointer; padding-right: 15px;">
                                    <i class="fa-solid fa-eye text-muted"></i>
                                </span>
                            </div>
                        </div>

                        <!-- Nút Hành động -->
                        <div class="d-flex gap-3 mt-2">
                            <a href="/dashboard" class="btn btn-light w-50 fw-bold py-3 shadow-sm d-flex justify-content-center align-items-center" style="border-radius: 12px; font-size: 14px; color: #64748b;">
                                <i class="fa-solid fa-arrow-left me-2"></i> Quay lại
                            </a>
                            <button type="submit" class="btn w-50 fw-bold py-3 text-white shadow d-flex justify-content-center align-items-center" style="border-radius: 12px; font-size: 14px; background: linear-gradient(135deg, #0ea5e9, #0284c7); border: none;">
                                <i class="fa-solid fa-floppy-disk me-2"></i> ĐỔI MẬT KHẨU
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script xử lý nút Hiện/Ẩn mật khẩu -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const toggleButtons = document.querySelectorAll('.toggle-pwd');
            toggleButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const inputField = this.parentElement.querySelector('.pwd-input');
                    const icon = this.querySelector('i');
                    
                    if (inputField.type === "password") {
                        inputField.type = "text";
                        icon.classList.remove('fa-eye');
                        icon.classList.add('fa-eye-slash', 'text-primary'); 
                    } else {
                        inputField.type = "password";
                        icon.classList.remove('fa-eye-slash', 'text-primary');
                        icon.classList.add('fa-eye', 'text-muted');
                    }
                });
            });
        });
    </script>
</body>
</html>
